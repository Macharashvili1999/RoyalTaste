<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Taste Catering</title>
  <style>
    body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
              url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
  background-size: cover;
  color: #333;
  margin: 0;
  padding: 20px 10px;
}

.container {
  max-width: 650px;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.96);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(5px);
}
    
    h1 { color: #1a252c; text-align: center; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 25px; }
    .card { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-weight: bold; font-size: 16px; }
    .card-price { color: #c5a059; font-weight: bold; }
    .add-btn { background: #1a252c; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    .add-btn:hover { background: #c5a059; }
    .cart-section { margin-top: 30px; border-top: 2px solid #c5a059; padding-top: 20px; }
    .inp { width: 100%; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .wa-btn { background: #25D366; color: white; border: none; width: 100%; padding: 14px; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; }
    .wa-btn:hover { background: #1eb954; }
  </style>
</head>
<body>

<div class="container">
<!-- ROYAL TASTE HEADER BANNER START -->
<div style="background: linear-gradient(135deg, #111a21 0%, #1a252c 50%, #0d1318 100%); padding: 35px 20px; text-align: center; border-radius: 12px; border: 1px solid #c5a059; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 25px; position: relative; overflow: hidden;">
  
  <!-- დეკორატიული ფონის ელემენტები -->
  <div style="position: absolute; top: -20px; left: -20px; width: 80px; height: 80px; border-top: 2px solid #c5a059; border-left: 2px solid #c5a059; opacity: 0.5;"></div>
  <div style="position: absolute; bottom: -20px; right: -20px; width: 80px; height: 80px; border-bottom: 2px solid #c5a059; border-right: 2px solid #c5a059; opacity: 0.5;"></div>

  <!-- გვირგვინის ლოგო (SVG) -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" width="60" height="30" style="margin-bottom: 5px;">
    <defs>
      <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#D4AF37" />
        <stop offset="50%" stop-color="#FFF2A3" />
        <stop offset="100%" stop-color="#AA771C" />
      </linearGradient>
    </defs>
    <path d="M 10 40 L 25 15 L 38 30 L 50 8 L 62 30 L 75 15 L 90 40 Z" fill="url(#gold)" />
    <circle cx="25" cy="12" r="3" fill="url(#gold)" />
    <circle cx="50" cy="5" r="4" fill="url(#gold)" />
    <circle cx="75" cy="12" r="3" fill="url(#gold)" />
    <rect x="10" y="43" width="80" height="5" rx="2" fill="url(#gold)" />
  </svg>

  <!-- მთავარი სათაური -->
  <h1 style="color: #D4AF37; font-family: 'Georgia', serif; font-size: 32px; font-weight: bold; letter-spacing: 4px; margin: 5px 0 0 0; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
    ROYAL TASTE
  </h1>
  
  <!-- ქვესათაური -->
  <div style="display: flex; align-items: center; justify-content: center; margin-top: 8px;">
    <span style="height: 1px; width: 30px; background: #c5a059; opacity: 0.6;"></span>
    <p style="color: #e0e0e0; font-family: Arial, sans-serif; font-size: 13px; letter-spacing: 3px; margin: 0 12px; text-transform: uppercase; font-weight: 300;">
      საუკეთესო გემო
    </p>
    <span style="height: 1px; width: 30px; background: #c5a059; opacity: 0.6;"></span>
  </div>

</div>
<!-- ROYAL TASTE HEADER BANNER END -->

  <!-- მენიუს კერძები -->
  <h3>📋 მენიუ</h3>
  
  <div class="card">
    <div>
      <div class="card-title">ხინკალი 5ც</div>
      <div class="card-price">10 €</div>
    </div>
    <button class="add-btn" onclick="addToCart('ხინკალი 5ც', 10)">+ დამატება</button>
  </div>

  <div class="card">
    <div>
      <div class="card-title">ხაჭაპური</div>
      <div class="card-price">10 €</div>
    </div>
    <button class="add-btn" onclick="addToCart('ხაჭაპური', 10)">+ დამატება</button>
  </div>

  <div class="card">
    <div>
      <div class="card-title">აჭარული ხაჭაპური</div>
      <div class="card-price">15 €</div>
    </div>
    <button class="add-btn" onclick="addToCart('აჭარული ხაჭაპური', 15)">+ დამატება</button>
  </div>

  <!-- კალათა და შეკვეთა -->
  <div class="cart-section">
    <h3>🛒 კალათა</h3>
    <div id="cart-items"><p style="color:#888;">კალათა ცარიელია</p></div>
    <h4>სულ ჯამი: <span id="cart-total">0</span> €</h4>

    <hr style="margin: 20px 0;">

    <label>სახელი და გვარი:</label>
    <input type="text" id="client-name" class="inp" placeholder="მაგ: გიორგი">

    <label>ტელეფონის ნომერი:</label>
    <input type="text" id="client-phone" class="inp" placeholder="მაგ: +34 600 000 000">

    <label>მისამართი:</label>
    <input type="text" id="client-address" class="inp" placeholder="ქუჩა, ნომერი, ქალაქი, პოსტკოდი">

    <!-- PAYMENT BUTTONS SECTION -->
<div style="background: #ffffff; padding: 20px; border-radius: 10px; margin: 20px 0; border: 1px solid #e2e8f0; text-align: center;">
  <h4 style="margin-top:0; color:#1a252c; font-size: 16px;">💳 აირჩიეთ გადახდის მეთოდი</h4>
  
  <!-- 1. Bizum-ით გადახდის ღილაკი -->
  <a href="https://wa.me/34603688449?text=გამარჯობა,%20მინდა%20Bizum-ით%20გადახდის%20რეკვიზიტების%20მიღება" 
     target="_blank" 
     style="display: block; background: #00a896; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 10px; font-size: 14px;">
     📱 გადაიხადე Bizum-ით
  </a>

  <!-- 2. ბარათით / Stripe-ით გადახდის ღილაკი -->
  <a href="https://buy.stripe.com/YOUR_STRIPE_LINK" 
     target="_blank" 
     style="display: block; background: #635bff; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px;">
     💳 გადაიხადე საბანკო ბარათით (Visa / Mastercard)
  </a>
  
  <p style="font-size: 11px; color: #888; margin-top: 10px;">
    🔒 გადახდა დაცულია უსაფრთხო საბანკო სისტემით
  </p>
</div>

    <button class="wa-btn" onclick="sendToWhatsApp()">📲 შეკვეთა WhatsApp-ით</button>
  </div>
</div>

<script>
 <script>
  let cart = [];

  // 1. პროდუქტის დამატება კალათაში (ან რაოდენობის გაზრდა)
  function addToCart(itemName, price) {
    const existingItem = cart.find(item => item.name === itemName);
    if (existingItem) {
      existingItem.quantity += 1;
    } else {
      cart.push({ name: itemName, price: price, quantity: 1 });
    }
    updateCartUI();
  }

  // 2. რაოდენობის შემცირება (ან წაშლა, თუ 1-მდე ჩამოვიდა)
  function removeFromCart(itemName) {
    const existingItemIndex = cart.findIndex(item => item.name === itemName);
    if (existingItemIndex !== -1) {
      if (cart[existingItemIndex].quantity > 1) {
        cart[existingItemIndex].quantity -= 1;
      } else {
        cart.splice(existingItemIndex, 1);
      }
    }
    updateCartUI();
  }

  // 3. კალათის ვიზუალის განახლება
  function updateCartUI() {
    const cartList = document.getElementById('cart-items');
    const totalEl = document.getElementById('cart-total');

    if (cart.length === 0) {
      cartList.innerHTML = '<p style="color:#888;">კალათა ცარიელია</p>';
      totalEl.innerText = 0;
      return;
    }

    cartList.innerHTML = '';
    let total = 0;

    cart.forEach((item) => {
      const itemTotal = item.price * item.quantity;
      total += itemTotal;

      cartList.innerHTML += `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #f8f9fa; padding: 8px 12px; border-radius: 6px;">
          <div>
            <strong>${item.name}</strong><br>
            <small>${item.price} € × ${item.quantity} = ${itemTotal} €</small>
          </div>
          <div>
            <button onclick="removeFromCart('${item.name}')" style="background: #e11d48; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">-</button>
            <span style="margin: 0 8px; font-weight: bold;">${item.quantity}</span>
            <button onclick="addToCart('${item.name}', ${item.price})" style="background: #16a34a; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">+</button>
          </div>
        </div>
      `;
    });

    totalEl.innerText = total;
  }

  // 4. შეკვეთის გაგზავნა WhatsApp-ზე
  function sendToWhatsApp() {
    if (cart.length === 0) {
      alert('გთხოვთ, ჯერ დაამატოთ კერძი კალათაში!');
      return;
    }

    const name = document.getElementById('client-name').value;
    const phone = document.getElementById('client-phone').value;
    const address = document.getElementById('client-address').value;

    if (!name || !phone || !address) {
      alert('გთხოვთ, შეავსოთ სახელი, ტელეფონი და მისამართი!');
      return;
    }

    let itemsText = cart.map(i => `- ${i.name} (${i.quantity}x) — ${i.price * i.quantity}€`).join('\n');
    let total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

    let message = `გამარჯობა! ახალი შეკვეთა Royal Taste-ში:\n\n` +
                  `📋 *შეკვეთა:*\n${itemsText}\n\n` +
                  `💰 *სულ ჯამი:* ${total} €\n\n` +
                  `👤 *სახელი:* ${name}\n` +
                  `📞 *ტელეფონი:* ${phone}\n` +
                  `📍 *მისამართი:* ${address}`;

    const myPhoneNumber = "34603688449"; 
    const whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(message)}`;
    window.open(whatsappUrl, '_blank');
  }
</script>
</script>

</body>
</html>
